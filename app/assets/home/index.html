<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bg"></div>

    <header id="top">
      <div id="clock-wrap">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
      <div id="chips">
        <div id="weather" class="glass chip">
          <span id="wx-icon"></span>
          <span id="wx-temp">--°</span>
          <span id="wx-text"></span>
        </div>
        <div id="settings" class="glass chip round" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.6.86 1 1.51 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
        </div>
      </div>
    </header>

    <section id="sketch" class="glass card empty-state">
      <div id="sketch-frame"><img id="sketch-img" alt=""><div id="sketch-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
        <span>Draw on your phone and tap Send</span></div></div>
      <div id="sketch-meta"><span id="sketch-from"></span><span id="sketch-when" class="muted"></span></div>
    </section>

    <section id="week" class="glass card">
      <div class="card-head">
        <span class="card-title">This week</span>
        <span id="cal-status" class="muted"></span>
      </div>
      <div id="week-cols"></div>
    </section>

    <nav id="dock" class="glass">
      <div id="dock-tiles"></div>
    </nav>
    <div id="dock-label"></div>

    <!-- Rueda TV intro: plays when the TV wakes up (and at a fresh start), then dissolves into the home screen. -->
    <div id="intro" aria-hidden="true">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="orb o4"></div>
      <div id="intro-mark">
        <div id="intro-lens"></div>
        <div id="intro-word"><span class="w1">Rueda</span><span class="w2">TV</span></div>
        <div id="intro-greet"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="ics.js"></script>
  <script src="app.js"></script>
</body>
</html>
