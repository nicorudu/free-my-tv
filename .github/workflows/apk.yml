# Builds Nico's FreeMyTV.apk (with the web home screen in app/assets/home) on every push to main, or by hand from
# the Actions tab. Download it from the run's "Artifacts". Signed with the key in the FREEMYTV_KEYSTORE_B64 and
# FREEMYTV_KEYSTORE_PASS secrets, so each new build installs over the last one (adb install -r) and keeps the TV's
# settings. No private links here: the calendar and sketch links are sent to the TV with adb (Secrets.WEB_HOME).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Settings
        run: |
          cat > config.properties <<'PROPS'
          tmdb_region=US
          currency=USD
          temperature=F
          show_crypto=false
          PROPS
      - name: Signing key
        env:
          KS: ${{ secrets.FREEMYTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FREEMYTV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No FREEMYTV_KEYSTORE_B64 secret: this build gets a throwaway key and won't install over another build."
          fi
      - name: Build
        env:
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.FREEMYTV_KEYSTORE_PASS }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk
          retention-days: 30
